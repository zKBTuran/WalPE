# Meson cross file, second layer: run the arm64 test programs of a cross
# build under QEMU's user-mode emulation.
#
#   meson setup build-arm64 --cross-file cross/aarch64-linux-gnu.ini \
#                           --cross-file cross/aarch64-qemu-user.ini
#   meson test -C build-arm64 --suite portable
#
# qemu-aarch64: package qemu-user (Debian / Ubuntu). -L names
# the directory that holds the target's /lib/ld-linux-aarch64.so.1: with
# the multiarch cross packages that is /usr/aarch64-linux-gnu.
#
# Only tests whose program meson starts itself go through the wrapper.
# Tests that are shell or Python scripts and start walpe-daemon / walpe-ctl
# on their own need binfmt_misc (package qemu-user-binfmt registers
# qemu-aarch64 for it) and QEMU_LD_PREFIX=/usr/aarch64-linux-gnu.
#
# Emulation proves that the code is correct for the instruction set and the
# ABI. It executes one instruction at a time in program order: it does not
# show what a real ARM core's memory ordering does to threads, and it says
# nothing about speed.

[binaries]
exe_wrapper = ['qemu-aarch64', '-L', '/usr/aarch64-linux-gnu']

[properties]
needs_exe_wrapper = true
