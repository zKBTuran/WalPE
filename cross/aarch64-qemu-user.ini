# Meson cross file, second layer: run the arm64 test programs of a cross
# build under QEMU's user-mode emulation.
#
#   meson setup build-arm64 -Dtests=true \
#                           --cross-file cross/aarch64-linux-gnu.ini \
#                           --cross-file cross/aarch64-qemu-user.ini
#   meson test -C build-arm64 --suite portable
#
# qemu-aarch64: package qemu-user (Debian / Ubuntu). -L names
# the directory that holds the target's /lib/ld-linux-aarch64.so.1: with
# the multiarch cross packages that is /usr/aarch64-linux-gnu.
#
# Only tests whose program meson starts itself go through the wrapper.
# Tests that are shell or Python scripts and start walpe-daemon / walpe-ctl
# on their own need binfmt_misc (package qemu-user-binfmt registers
# qemu-aarch64 for it) and QEMU_LD_PREFIX=/usr/aarch64-linux-gnu.
#
# Emulation proves that the code is correct for the instruction set and the
# ABI. It executes one instruction at a time in program order: it does not
# show what a real ARM core's memory ordering does to threads, and it says
# nothing about speed.

#
# -cpu max,pauth-impdef=on: the build signs return addresses
# (-mbranch-protection=standard) and so do the distribution's libraries.
# QEMU 8.2 emulates the architected algorithm for that (QARMA5) in software
# on every call and return, which makes call-heavy code several times
# slower again than emulation already is (the test `formats`: 4 min 51 s,
# with the option 33 s), and the tests that limit CPU time (formats,
# script-hostile) then fail. pauth-impdef=on keeps the feature with a
# cheap algorithm. A qemu that does not know the property
# says so and starts nothing: take the two words out then. For programs
# started through binfmt_misc the same is QEMU_CPU=max,pauth-impdef=on.
#
# With the arm64 libraries in a sysroot instead of multiarch packages, use
# cross/aarch64-sysroot.ini in place of this file.

[binaries]
exe_wrapper = ['qemu-aarch64', '-cpu', 'max,pauth-impdef=on', '-L', '/usr/aarch64-linux-gnu']

[properties]
needs_exe_wrapper = true
