# Meson cross file, second layer: the arm64 libraries are in a directory of
# their own (a sysroot: an unpacked arm64 root file system with the
# development packages) instead of installed next to the build machine's
# as multiarch packages.
#
#   cp cross/aarch64-sysroot.ini my-sysroot.ini      # and set `sysroot` below
#   meson setup build-arm64 -Dtests=true \
#                           --cross-file cross/aarch64-linux-gnu.ini \
#                           --cross-file my-sysroot.ini
#   ninja -C build-arm64 programs
#   meson test -C build-arm64 --suite portable -t 10
#
# Given after cross/aarch64-linux-gnu.ini (the compiler and the machine),
# it replaces that file's pkg-config directories and adds the rest: the
# compiler and the linker look in the sysroot only, pkg-config reads the
# sysroot's .pc files and puts the sysroot in front of their paths, QuickJS
# is found in <sysroot>/usr/lib/quickjs (meson.build reads sys_root), and
# the test programs run under qemu-aarch64 with the sysroot's loader and
# libraries. cross/aarch64-qemu-user.ini is not given with this file.
#
# -cpu max,pauth-impdef=on: the build signs return addresses
# (-mbranch-protection=standard) and so do the distribution's libraries.
# QEMU 8.2 emulates the architected algorithm for that (QARMA5) in software
# on every call and return, which makes call-heavy code several times
# slower again than emulation already is (the test `formats`: 4 min 51 s,
# with the option 33 s), and the tests that limit CPU time (formats,
# script-hostile) then fail. pauth-impdef=on keeps the feature with a
# cheap algorithm. A qemu that does not know the property
# says so and starts nothing: take the two words out then.

[constants]
sysroot = '/path/to/arm64-sysroot'

[binaries]
exe_wrapper = ['qemu-aarch64', '-cpu', 'max,pauth-impdef=on', '-L', sysroot]

[properties]
sys_root = sysroot
pkg_config_libdir = [sysroot + '/usr/lib/aarch64-linux-gnu/pkgconfig', sysroot + '/usr/lib/pkgconfig', sysroot + '/usr/share/pkgconfig']
needs_exe_wrapper = true

[built-in options]
c_args = ['--sysroot=' + sysroot]
c_link_args = ['--sysroot=' + sysroot]
