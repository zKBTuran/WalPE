# Meson cross file: build WalPE for 64-bit ARM (aarch64, little-endian) on
# another machine, with the cross toolchain and the multiarch libraries of
# Debian / Ubuntu.
#
#   meson setup build-arm64 --cross-file cross/aarch64-linux-gnu.ini
#   ninja -C build-arm64
#
# What has to be installed (Ubuntu 24.04 names; docs/BUILDING.md, "64-bit ARM (aarch64)"):
#   gcc-aarch64-linux-gnu  (the compiler, binutils and the arm64 C library)
#   the arm64 development packages of the libraries, e.g. libgtk-4-dev:arm64
#   (dpkg --add-architecture arm64 and a package source that carries arm64)
#
# native_tuning stays generic in a cross build (native is refused there);
# a known target CPU goes into c_args, e.g. -Dc_args=-mcpu=cortex-a76.
#
# Running the tests needs something that executes arm64 programs: give
# cross/aarch64-qemu-user.ini as a second --cross-file, or register
# qemu-user with binfmt_misc.

[constants]
triplet = 'aarch64-linux-gnu'

[binaries]
c = triplet + '-gcc'
# the gcc-* wrappers load the LTO plugin: the static core library is built
# with -flto (b_lto=true) and a plain ar cannot index its objects
ar = triplet + '-gcc-ar'
nm = triplet + '-gcc-nm'
ranlib = triplet + '-gcc-ranlib'
strip = triplet + '-strip'
# (meson before 1.3 reads the entry under the name pkgconfig)
pkg-config = 'pkg-config'
pkgconfig = 'pkg-config'

[properties]
# .pc files of the target only, never the build machine's
pkg_config_libdir = ['/usr/lib/' + triplet + '/pkgconfig', '/usr/share/pkgconfig']
# a separate root file system for the target instead of multiarch:
#   sys_root = '/path/to/arm64-rootfs'
#   pkg_config_libdir = [sys_root + '/usr/lib/aarch64-linux-gnu/pkgconfig', sys_root + '/usr/share/pkgconfig']
# and --sysroot=<the same path> in c_args and c_link_args

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
